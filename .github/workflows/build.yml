name: Build WinCore v0.2 EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Release EXE
        run: cargo build --release

      - name: Upload wincore.exe
        uses: actions/upload-artifact@v4
        with:
          name: wincore-v0.2-windows
          path: target/release/wincore.exe
